name: Nativos Android

# Compila los nativos en el runner Linux. Con una etiqueta natives-v* publica el release.
on:
  workflow_dispatch:
  push:
    tags: ['natives-v*']

permissions:
  contents: read

jobs:
  # ANGLE va aparte: tarda ~1 h y necesita casi todo el disco del runner.
  angle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Compilar ANGLE
        run: bash Scripts/build-angle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: angle
          path: angle/*

  build:
    needs: angle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write   # solo para subir el release
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build automake libtool libltdl-dev

      # CMake 3.x: el 4.x ya no acepta el cmake_minimum_required viejo del toolchain del NDK.
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      # jni.h para compilar LWJGL.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - uses: actions/download-artifact@v4
        with:
          name: angle
          path: angle

      - name: Compilar
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash Scripts/build-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: natives-android-arm64-v8a
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/natives-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Nativos arm64-v8a para Minecraft 26.3+. Ver README."
